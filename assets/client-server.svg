<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" rx="28" fill="#fff2e2"/><text x="70" y="76" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#bb8034">WINDOWS ENVIRONMENTS · LEARNING DIAGRAM</text><text x="70" y="132" font-family="Arial" font-size="42" font-weight="700" fill="#182235">Client–Server Architecture</text><text x="70" y="169" font-family="Arial" font-size="19" fill="#647087">Illustrative enterprise model for understanding roles and communication</text><g font-family="Arial" text-anchor="middle"><rect x="100" y="250" width="280" height="175" rx="18" fill="#fff" stroke="#f0d5b1" stroke-width="3"/><rect x="200" y="280" width="80" height="58" rx="8" fill="#fff0dc" stroke="#d59a4e" stroke-width="3"/><path d="M190 347h100M225 338v9M255 338v9" stroke="#d59a4e" stroke-width="4"/><text x="240" y="383" font-size="25" font-weight="700" fill="#182235">Client OS</text><text x="240" y="408" font-size="15" fill="#647087">User device / requests</text><rect x="820" y="250" width="280" height="175" rx="18" fill="#182235"/><rect x="920" y="278" width="80" height="65" rx="8" fill="#35445c"/><path d="M930 294h60M930 307h60M930 320h60" stroke="#c9f2df" stroke-width="4"/><text x="960" y="383" font-size="25" font-weight="700" fill="#fff">Windows Server</text><text x="960" y="408" font-size="15" fill="#c3ccda">Shared roles / services</text><path d="M400 320H800m-18-14 18 14-18 14" stroke="#c18a43" stroke-width="6" fill="none" stroke-linecap="round"/><text x="600" y="288" font-family="Arial" font-size="17" font-weight="700" text-anchor="middle" fill="#a66e2b">Network communication</text><text x="600" y="365" font-family="Arial" font-size="15" text-anchor="middle" fill="#647087">Request ↔ Response</text></g><text x="70" y="500" font-family="Arial" font-size="16" fill="#647087">Client OS supports end-user activity; server OS provides centrally managed services to clients.</text></svg>